name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to what the project is developed and tested against. On
          # `stable` the runner quietly moved to a newer SDK than any local
          # machine, and the first thing that happened was the analyser
          # failing on a lint that does not exist here — while the release
          # workflows went on building the shipped IPA with an SDK nothing
          # had been tested on. Upgrading is a decision, not a Tuesday.
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify generated code is current
        run: |
          dart run build_runner build
          flutter gen-l10n
          git diff --exit-code -- lib

      - run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze --fatal-infos --fatal-warnings

      - run: flutter test --exclude-tags performance

      - name: Performance tests, one at a time
        run: flutter test --tags performance -j 1
